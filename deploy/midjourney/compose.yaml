# 本机代理部署草案；账号关联后再联调。此文件不会启动任何生成任务。
# 镜像版本来自上游 docs/docker-start.md，尚未验证当前 Discord/MJ 的兼容性。
name: autodl-midjourney
services:
  midjourney-proxy:
    image: novicezk/midjourney-proxy:2.6.3
    ports:
      - "127.0.0.1:6013:8080"
    environment:
      "mj.discord.guild-id": "${MJ_DISCORD_GUILD_ID:?请填写 Discord 服务器 ID}"
      "mj.discord.channel-id": "${MJ_DISCORD_CHANNEL_ID:?请填写 Discord 文字频道 ID}"
      "mj.discord.user-token": "${MJ_DISCORD_USER_TOKEN:?请在本机填写 Discord 用户凭据}"
      "mj.api-secret": "${MJ_API_SECRET:?请设置独立的本地代理密钥}"
      "mj.discord.core-size": "1"
      "mj.discord.queue-size": "3"
      "mj.translate-way": "null"
      "mj.task-store.type": "in_memory"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
