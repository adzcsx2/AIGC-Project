[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autodl-aigc"
version = "0.1.0"
description = "YAML-driven AutoDL ComfyUI video and audio generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2,<3"]

[project.scripts]
autodl = "autodl_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents/skills", ".agents/resources", "docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
