interface:
  display_name: "文案、设计与媒体审计修复（review）"
  short_description: "审计发现问题即实际修复并验证，至少五轮完整复审；仅真实阻碍或明确只审不改时留项"
  default_prompt: "Use $review to audit, actually repair, and verify this text, design, or media within existing authorization; complete at least five fresh full-scope passes, continue fixing and rechecking until all required items pass, and report only genuine blockers rather than stopping at findings or a round count."
policy:
  allow_implicit_invocation: true
