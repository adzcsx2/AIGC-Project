# 先执行 autodl mj validate 本文件；run 会消耗 Midjourney 会员额度。
# 参考图片按普通 image prompt 上传；V8 编辑器的角色绑定能力尚未验证。
prompt: >-
  Full-body portrait of an adult silver-haired elven sorceress in an Eastern xianxia fantasy world,
  with a delicate oval face, pale gray-green eyes and pointed ears. One elongated blue-violet
  faceted gemstone rests vertically at the center of her forehead, held by fine silver twig
  filigree lying close to the skin. Tiny translucent crystal flecks and pearlescent silver shimmer
  catch the light across her forehead, temples and upper cheekbones, with natural skin texture visible.
  Fitted silver-blue light armor, white silk trousers and tall boots. She holds one slender silver
  staff in her right hand, with a narrow crescent surrounding a single blue crystal.
  Natural proportions, head, boots and entire staff inside the frame. Soft cool backlight,
  realistic cinematic fantasy CG, simple pale gray background, one character without text or panels.
  --ar 9:16 --chaos 0 --stylize 50
reference_images:
  - ../assets/双精灵对决/参考图-银发精灵.png
output_dir: outputs/midjourney
timeout: 1800
poll_interval: 3
