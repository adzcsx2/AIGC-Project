# 复制到具体剧集后填写。所有路径相对此文件；不要把示例改为 ready 来绕过补图。
schema_version: 1
documents:
  brief: {path: 需求.md, state: missing}
  style: {path: 视觉设定.md, state: missing}
  script: {path: 剧本.md, state: missing}
  storyboard: {path: 分镜.md, state: missing}
assets:
  CHAR-01:
    kind: character
    required: true
    path: assets/角色01.png
    state: missing
    prompt: Write the English Midjourney prompt for this character in the image-prompt document.
  SCENE-01:
    kind: scene
    required: true
    path: assets/场景01.png
    state: missing
    prompt: Write the English Midjourney prompt for this scene in the image-prompt document.
shots:
  SHOT-01:
    required_assets: [CHAR-01, SCENE-01]
    reference_bindings:
      ref_image_0: CHAR-01
      ref_image_1: SCENE-01
