    instructions: '### MiniMax H3九图三音15s(画质增强版)


      在H3九图15s(画质增强版)基础上增加了多段声音支持，可让三个角色分别对应三段音频进行表达，适合口播、多人对话、直播间带货、访谈片段和内容讲解。


      使用时注意两个对应关系：


      - 角色顺序：9 张参考图中的人物顺序要和画面出场顺序一致；

      - 声音顺序：第 1、2、3 段音频分别对应当场说话 1、2、3 个角色。


      音频数量不足时可以只填 1 段或 2 段，剩余角色位留空即可，不要传无效音频。建议在提示词中写明“按顺序说话、不抢话、不串音、声音不重叠”，并保留“无字幕、无文字、无水印”约束。


      **字幕出现概率稍微增加,使用多参音频参考主模型:**

      兼容：<audio 0>  <audio 1>  <audio 2>的正向提示词音色参考格式.  带不带音频文件都可以.

      兼容：角色A dialogue：<d>[Chinese]「宝子你好。」<d> 的H3标准音色参考格式.


      ### 核心能力


      **画质优先：** 在九图基础上做画质增强处理。

      **多段音频：** 最多支持 3 段参考音频，分别驱动不同角色。

      **口型与表演：** 说话时保持自然口型、轻微转头和简洁手势。

      **九图参考：** 支持多个角色、产品和场景参考。

      **多种清晰度：** 支持 480P 到 2K（QHD）顶配档位。

      **竖屏横屏：** 支持 `9:16` 和 `16:9` 两种画幅。

      **速度可调：** 支持高速和高质两个模式，高速模式处理速度更快，高质模式画面质量和人脸处理更好。


      ### 适用场景


      **多人对话：** 三个角色轮流说话的剧情或访谈片段。

      **直播带货：** 多位主播分别讲解不同产品。

      **口播与讲解：** 需要人物说话、配合画面展示的内容。

      **音乐短视频：** 角色配合音乐节奏完成表情和动作。


      ### 使用方式


      准备 9 张参考图和最多 3 段音频 → 编写提示词并写清说话顺序 → 设置时长、画幅、清晰度、模式 → 提交生成。

      '
