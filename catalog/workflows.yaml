    instructions: '### MiniMax H3九图15s(无字幕版)


      针对的是"竖屏+真人剧"解决画面上出现字幕的问题。若是"横屏+真人剧",则提示词可以适当放松自行适配，出字幕的概率也不会太高,请自行尝试.


      这版能力对提示词写法有明确要求：**必须先在开篇飞书文档中预览[《去字幕-API-提示词模版》](https://hcnp6acwrpmt.feishu.cn/wiki/WU04wSYfHiRL3ukRQHVcLDHDnbd)，按其中的角色卡参考图和结构化提示词方式提交。**
      只用一句普通描述去生成，甚至标准的H3提示词,仍然会出现字幕! 请务必注意!!!。


      文档里有可直接参考的模板，重点记住两点：


      1. 参考图按飞书要求生成角色卡，同一人物多角度保持一致；

      2. 让AI学习提示词格式, 严格准守飞书文档方案A或方案B的范本格式。


      模板全文较长，建议先照抄飞书模板跑通一次，再按自己的角色和剧本进行修改。


      **因需要保持低字幕,使用低字幕主模型:**

      不兼容：<audio 0>  <audio 1>  <audio 2>的正向提示词音色参考特殊格式.

      必须使用：角色A dialogue：<d>[Chinese]「宝子你好。」<d> 的H3标准音色参考格式.


      ### 核心能力


      **字幕强抑制：** 配合专用提示词写法，明显减少成片中的字幕和印刷文字。

      **九图参考：** 支持 9 张参考图，可同时提供多个角色和场景。

      **分镜控制：** 提示词支持按时间段、景别、角色、动作和台词组织剧情。

      **多种清晰度：** 支持 480P 到 2K（QHD）顶配档位。

      **竖屏横屏：** 支持 `9:16` 和 `16:9` 两种画幅。

      **速度可调：** 支持高速和高质两个模式，高速模式处理速度更快，高质模式画面质量和人脸处理更好。


      ### 适用场景


      **情景短剧：** 短剧,真人剧等对话片段。

      **剧情片段：** 有明确分镜和台词的短剧情内容。

      **角色展示：** 多个人物依次出场、基本不同框的展示片段。

      **自媒体内容：** 需要干净画面、不带字幕的短视频素材。


      ### 使用方式


      打开飞书模板文档并预览 → 按角色卡方式准备 9 张参考图 → 按结构化模板写提示词 → 设置时长、画幅、清晰度、模式 → 提交生成。

      '
