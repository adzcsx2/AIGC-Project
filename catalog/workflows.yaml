      MiniMax H3 六图生视频是一款支持多张参考图片协同生成的视频创作能力。用户上传 6 张参考图片并输入视频生成提示词，即可将人物、动物、产品、场景或造型等视觉素材融合到同一个视频中。


      多张图片可以从不同角度补充主体信息，也可以分别提供角色、产品和场景参考，使生成内容具有更丰富的视觉依据。


      该工作流采用一次采样方式直出视频，并通过扩图模型提升输出分辨率，效果绝非二次采样扩图混血工作流可比！适合重视画面质量、动作表现和成片稳定性的创作任务。


      ### 核心能力


      **六图参考：** 支持 6 张参考图片共同参与视频创作。

      **多素材融合：** 可组合人物、动物、产品、服装、道具和场景图片。

      **提示词控制：** 通过文字描述主体动作、场景变化和镜头运动。

      **角色表现：** 适合需要人物、角色或产品外观参考的视频。

      **灵活时长：** 支持 1～15 秒视频生成。

      **高质量输出：** 采用一次采样直出，并提升最终画面清晰度。


      ### 适用场景


      **人物与角色展示：** 使用多张人物图表现角色外观、服装和不同角度。

      **产品展示：** 结合产品正面、侧面、细节和使用场景生成宣传视频。

      **分镜创作：** 使用多张分镜或场景图构建连续的视频内容。

      **广告内容：** 将人物、产品和环境素材组合成品牌宣传片段。

      **短视频创作：** 把多张静态图片转化为连贯、有动作的视频。


      ### 使用方式


      上传 6 张参考图片 → 输入视频生成提示词 → 设置视频时长、画幅和清晰度 → 提交生成，即可获得多图参考 AI 视频。


