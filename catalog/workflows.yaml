    instructions: '### MiniMax-H3 视频多角色替换（最大支持25秒9角色）


      MiniMax-H3 视频多角色替换用多张参考图里的角色，同时替换引导视频里已经存在的多个角色。角色可以是人、动物、机器人，或任何能单独指认的主体。


      ### 核心能力


      多角色替换：一次替换引导视频里的多个角色。每张参考图换一个角色。默认无需写提示词。


      自定义检测类型：默认检测人。也可以改成检测动物、物品或其他主体，类型对照见文末。一次只填一种。


      跨种类替换：可以用人物替换动物，也可以用机器人替换人物。只换身份，动作、位置、节奏和镜头仍跟引导视频。没被换到的角色保持原样。


      原声保留：引导视频的原声已经对齐，成片带上这条原声，口型按原声对齐。


      ### 适用场景


      多人重演：用新的人物形象，重演一段已有视频里几个人的动作和表演。


      主唱或 C 位替换：群舞、MV 里参考图比人少时，默认换出镜最久、占画面最大、站在中间的那几个人，伴舞保持原样。


      跨形象替换：把视频里的人物换成动物或机器人，或把动物换成人物，镜头和节奏保持原片。


      表演迁移：保留原片的走位、接触、遮挡、停顿和突变，只更换被点名的那几个角色的身份与服装。


      短视频二创：上传几张角色图和一段引导视频，得到原片运镜下的新角色成片。


      ### 参考图和人物怎么对应？


      用户写明了换谁，以用户为准。没写时按下面的规则：


      参考图张数和画面里的人数一样：从左到右对应，图1换人物1，图2换人物2。


      参考图比人少：换最主要的几个人，通常是主唱、领舞或站在中间的人。挑出来的人按从左到右对应图1、图2。


      参考图比人多：多出来的图不使用。


      用户写了某个人不换：那个人保持原样。


      想指定某一个人时，直接写位置或特征，例如「图1换左边穿黑甲的」「图2换主唱」。


      ### 提示词是否需要单独写？


      通常会自动识别角色，无需单独写提示词。


      ### 什么时候需要提示词？


      想指定谁换谁，比如「图1换中间金发的主唱，图3换最右边的人」


      想让某个人不换，比如「右边穿白背心的伴舞不换」


      替换后想保持某些物品不变，比如视频中角色手拿话筒，则需要提示词「保留手里的话筒」


      替换的同时修改文字，比如视频中的某个招牌文字，替换后想变成其他文字，则需要提示词「招牌文字改为：某某面馆」


      替换的同时想增强某些方面，比如视频中的角色手中武器火焰特效，可以在提示词写「增强角色手中武器火焰特效」


      想改某个替换者的穿着，比如「图1换成红色外套」。只影响这一个人，其余仍按参考图。


      生成时长比引导视频长，想规定后面发生什么，比如「5秒后角色开始跳舞」


      一次替换的人太多，每个人的长相会越来越不稳定。建议一次换 3 到 4 个人，优先换主要角色。


      ### 提示词是否需要按照MINIMAX-H3的提示词格式？


      不需要，只需要按照上面的简单格式写即可。按照H3格式写可能会影响替换效果。


      ### 检测类型怎么填？（底部有对照表）


      在「追踪对象」里填写下表的英文，一次只填一种。想检测得更准，可以自己写更具体的英文，例如 man with blonde hair、white dog。人和其他种类不能同一次一起检测。


      目标很小，或是卡通、毛绒、造型特殊的角色时，可能漏检。


      ### 视频长度比设定时间短能用吗？


      可以，视频长度小于设定时间时，能正常生成多角色替换，但后面无参考视频段可能会自由发挥，建议不要输入低于设定时间的视频。也可以通过提示词来改变无参考视频中的视频走向，例如原本5秒视频参考，但设置输出10，就可以提示词写「5秒后角色开始跳舞」。


      ### 输入竖版视频参考，但输出横板视频能用吗？


      输出视频会根据输入视频的宽高比进行裁剪，可能会将视频有用画面裁剪掉一部分。建议输入视频时，尽量使用目标比例的视频。


      ### 能完全使用自己写的提示词吗？


      目前已经内置了替换的提示词，如果需要完全使用自己写的提示词，可能不符合预期效果。所以目前暂时不支持完全使用自己写的提示词。


      ### 视频中有几个人没换正确怎么办？


      由于模型的能力有限，对切镜头或人物走位穿插的替换效果多个替换效果不好，建议使用人数少的例如5人以内，通常3人的较好。


      ### 视频中人脸不清晰怎么办？


      由于模型的能力有限，尽量选择脸部比例不要过小的参考视频来做。


      ### 可支持自定义的检测类型对照（使用时输入英文）H3全自动角色动迁替换


      | 类别     | 中文 英文                                                                                                                                                                                                       |

      | -------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
      |

      | 人物     | 人 person、男人 man、女人 woman、小孩 child、婴儿 baby、老人 old man、脸 face、头发 hair、手 hand                                                                                                               |

      | 宠物     | 狗 dog、猫 cat、兔子 rabbit、仓鼠 hamster、鹦鹉 parrot、鸟 bird、金鱼 goldfish、乌龟 turtle                                                                                                                     |

      | 动物     | 马 horse、牛 cow、羊 sheep、猪 pig、鸡 chicken、鸭 duck、猴子 monkey、熊猫 panda、熊 bear、老虎 tiger、狮子 lion、狼
      wolf、狐狸 fox、大象 elephant、鹿 deer、海豚 dolphin、鲨鱼 shark、蛇 snake、蝴蝶 butterfly |

      | 幻想角色 | 恐龙 dinosaur、龙 dragon、机器人 robot、玩偶 doll、毛绒玩具 stuffed toy、雕像 statue                                                                                                                            |

      | 服装     | 衣服 clothes、上衣 shirt、T恤 t-shirt、外套 jacket、西装 suit、连衣裙 dress、裤子 pants、裙子 skirt、鞋 shoe、运动鞋
      sneaker、帽子 hat、制服 uniform                                                            |

      | 配饰     | 眼镜 glasses、墨镜 sunglasses、口罩 face mask、围巾 scarf、领带 tie、手表 watch、项链 necklace、耳环 earring、戒指
      ring、包 bag、背包 backpack、手提包 handbag                                                  |

      | 数码     | 手机 cell phone、笔记本电脑 laptop、平板 tablet、耳机 headphones、相机 camera、麦克风 microphone、游戏手柄 game
      controller、电视 tv                                                                             |

      | 美妆个护 | 口红 lipstick、香水 perfume、化妆品瓶 cosmetic bottle、镜子 mirror、梳子 comb                                                                                                                                   |

      | 食物饮品 | 杯子 cup、咖啡杯 coffee cup、奶茶 milk tea、瓶子 bottle、酒杯 wine glass、蛋糕 cake、汉堡 burger、披萨 pizza、冰淇淋
      ice cream、水果 fruit、苹果 apple、碗 bowl、盘子 plate                                     |

      | 道具     | 花 flower、花束 bouquet、气球 balloon、礼物盒 gift box、球 ball、书 book、雨伞 umbrella、剑 sword、枪 gun、吉他
      guitar、滑板 skateboard、行李箱 suitcase                                                        |

      | 家居     | 椅子 chair、沙发 couch、桌子 table、床 bed、台灯 lamp、时钟 clock、花瓶 vase、相框 picture frame                                                                                                                |

      | 交通工具 | 汽车 car、跑车 sports car、自行车 bicycle、摩托车 motorcycle、公交车 bus、飞机 airplane、船 boat、火车 train                                                                                                    |


      填英文，多个用英文逗号隔开，例如 person, cell phone 或 dog, cat。可以加颜色：red cup、white car。不要写中文，也不要写「左边那个」这种位置。

