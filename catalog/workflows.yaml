    instructions: '#### MiniMax H3 文生视频


      MiniMax H3 文生视频是一款使用自然语言直接创作视频的生成能力。用户只需描述人物、动物、产品、场景、动作、镜头和画面风格，即可将文字创意转化为连贯的视频内容。


      该工作流采用一次采样方式直出视频，并通过扩图模型提升输出分辨率，效果绝非二次采样扩图混血工作流可比！适合重视画面质量、动作表现和成片稳定性的创作任务。


      ### 核心能力


      **文字生成视频：** 无需准备图片或音频，仅使用文字描述即可创作视频。

      **提示词控制：** 可描述主体、动作、场景、镜头运动、光线和艺术风格。

      **灵活时长：** 支持 1～15 秒视频生成，可根据内容需求设置时长。

      **多种画幅：** 支持常见横屏、竖屏及其他画幅输出。

      **多种清晰度：** 可选择不同输出清晰度，满足预览、短视频和高质量成片需求。

      **高质量直出：** 一次采样完成视频生成，兼顾清晰度、速度和稳定性。


      ### 适用场景


      **创意短视频：** 将一句创意描述快速转化为动态画面。

      **广告概念制作：** 生成产品宣传、品牌氛围和视觉创意片段。

      **故事与剧情创作：** 制作人物动作、环境变化和镜头叙事内容。

      **自媒体内容：** 生成适合不同内容平台的横屏或竖屏视频。

      **视觉方案预览：** 在正式制作前快速查看场景、动作和镜头效果。


      ### 使用方式


      输入视频生成提示词 → 设置视频时长 → 选择输出画幅和清晰度 → 提交生成，即可获得 AI 视频。


      让文字创意直接变成清晰、连贯、具有镜头表现力的视频内容。

      '
