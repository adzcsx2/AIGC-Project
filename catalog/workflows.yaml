      MiniMax-H3 视频角色替换，用一张参考图里的角色，替换引导视频里已经存在的一个角色。角色可以是人、动物、机器人，或任何能单独指认的主体。


      ### 核心能力


      单角色替换：一次只替换引导视频里的一个角色。默认无需写提示词，自动替换正在表演或被镜头对着的那个角色。

      跨种类替换：可以用人物替换动物，也可以用机器人替换人物。只换这一个身份，动作、位置、节奏和镜头仍跟引导视频。

      原声保留：引导视频的原声已经对齐，成片带上这条原声，口型按原声对齐。


      ### 适用场景


      角色重演：用新的人物形象，重演一段已有视频里的动作和表演。

      跨形象替换：把视频里的人物换成动物或机器人，或把动物换成人物，镜头和节奏保持原片。

      表演迁移：保留原片的走位、接触、停顿和突变，只更换其中一个角色的身份与服装。

      短视频二创：上传一张角色图和一段引导视频，得到原片运镜下的新角色成片。


      ### 提示词是否需要单独写？


      通常会自动识别角色，无需单独写提示词。


      ### 什么时候需要提示词？


      替换后想保持某些物品不变，比如视频中角色手拿话筒，则需要提示词“保留手里的话筒”

      替换后的同时修改文字，比如视频中的某个招牌文字，替换后想变成了其他文字，则需要提示词“招牌文字改为：某某面馆”

      替换的同时想增强某些方面，比如视频中的角色手中武器火焰特效，可以再提示词写“增强角色手中武器火焰特效”


      ### 提示词是否需要按照MINIMAX-H3的提示词格式？


      不需要，只需要按照上面的简单格式写即可。按照H3格式写可能会影响替换效果。


      ### 视频长度比设定时间短能用吗？


      可以，视频长度小于设定时间时，能正常生成单角色替换，但后面无参考视频段可能会自由发挥，建议不要输入低于设定时间的视频。也可以通过提示词来改变无参考视频中的视频走向，例如原本5秒视频参考，但设置输出10，就可以提示词写”5秒后角色开始跳舞“


      ### 输入竖版视频参考，但输出横板视频能用吗？


      输出视频会根据输入视频的宽高比进行裁剪，可能会将视频有用画面裁剪掉一部分。建议输入视频时，尽量使用目标比例的视频


      ### 能完全使用自己写的提示词吗？


      目前已经内置了替换的提示词，如果需要完全使用自己写的提示词，可能不符合预期效果。所以目前暂时不支持完全使用自己写的提示词。

      '
