    instructions: '# MiniMax-H3 多图多音频生视频


      **MiniMax-H3 多图多音频生视频**是一款支持多张参考图片与多段参考音频协同生成的视频创作能力。用户只需上传图片、音频并输入视频生成提示词，即可将多个视觉素材与声音素材融合到同一视频中，快速生成具有连贯动作、自然镜头运动和丰富表现力的
      AI 视频。


      支持 **最多 9 张参考图片 + 3 段参考音频** ，可用于人物、场景、产品、角色关系等多素材创作。通过提示词控制主体动作、场景变化、镜头运动及整体画面表现，让多个参考素材在同一视频中实现更自然的融合。


      ### 核心能力


      * **多图参考** ：支持最多 9 张参考图片，可同时提供人物、动物、产品、场景等视觉素材。

      * **多音频参考** ：支持最多 3 段参考音频，可结合不同声音素材进行视频创作。

      * **音画融合** ：将视觉内容与音频素材结合，增强视频的沉浸感和表现力。

      * **提示词控制** ：通过自然语言描述主体、动作、场景、镜头运动等内容，控制视频生成效果。

      * **灵活时长** ：支持 1～15 秒视频生成，可根据实际创作需求自由设置。

      * **多种分辨率** ：支持 480p、768p横竖屏输出，满足不同场景的视频制作需求。

      * **多素材创作** ：适用于角色互动、产品展示、故事片段、广告宣传、短视频内容等多种场景。


      ### 适用场景


      **人物与角色创作** ：结合多个人物参考图，生成角色互动、对话、动作等视频内容。


      **产品与广告展示** ：使用产品图片、场景图片和音频素材，快速生成产品宣传及广告视频。


      **故事与剧情创作** ：通过多张角色、场景参考图配合音频，构建连续的剧情画面。


      **短视频创作** ：输入图片、音频和简单提示词，即可快速生成适合短视频平台使用的 AI 视频。


      **创意视觉内容** ：将不同图片和声音素材进行组合，通过提示词实现更加丰富的视觉表达。


      ### 使用方式


      上传所需的参考图片和音频 → 输入视频生成提示词 → 设置视频时长与输出分辨率 → 提交生成，即可获得 AI 视频。


      **让多张图片、多段声音与 AI 视频生成能力结合，快速将静态素材转化为动态、连续且富有表现力的视频内容。**

      '
