    instructions: '### MiniMax H3九图15s(画质增强版)


      面向对画质要求更高的客户。它同样使用 9 张参考图，适合人物密集、场景复杂、需要更多参考素材的创作任务，例如多位模特轮流出场、多个产品连续展示、复杂分镜片段等。


      **因需要保持低字幕,使用低字幕主模型:**

      不兼容：<audio 0>  <audio 1>  <audio 2>的正向提示词音色参考特殊格式.

      必须使用：角色A dialogue：<d>[Chinese]「宝子你好。」<d> 的H3标准音色参考格式.


      ### 核心能力


      **画质优先：** 针对细节、材质和清晰度做增强处理。

      **九图参考：** 支持 9 张参考图，可组合多个角色、产品和场景。

      **多人出场：** 适合多人物依次独立出场的卡点、展示类视频。

      **多种清晰度：** 支持从 480P 到 2K（QHD）顶配的档位。

      **竖屏横屏：** 支持 `9:16` 和 `16:9` 两种画幅。

      **速度可调：** 支持高速和高质两个模式，高速模式处理速度更快，高质模式画面质量和人脸处理更好。


      ### 适用场景


      **电商带货：** 多位模特轮流出场展示服装、美妆、配饰。

      **短剧与卡点视频：** 人物依次出场、快速硬切的内容。

      **产品展示：** 多个产品或多角度素材组合成宣传片段。

      **数字人素材：** 需要干净画面和高清晰度的人物视频。


      ### 使用方式


      准备 9 张参考图（前 8 张人物或产品，第 9 张场景）→ 编写提示词 → 设置时长、画幅、清晰度、模式 → 提交生成。

      '
