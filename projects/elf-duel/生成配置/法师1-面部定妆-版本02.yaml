  bones, and around the outer eye corners and upper cheekbones. Irregular clusters of tiny icy-white,
  pale blue and lilac glints, with uncovered skin between the flecks and natural pores still visible.
  The delicate crystalline shimmer belongs to her skin, separate from the larger forehead gemstone.
  A glimpse of silver-blue and pale lilac shoulder armor, soft cool backlight, gentle frontal fill,
  controlled highlights, shallow depth of field, realistic cinematic fantasy CG, pale blue-gray
  background. One portrait, no tall crown, antlers, oversized facial rhinestones, opaque glitter mask,
  floating star particles, text or panels. --ar 3:4 --chaos 0 --stylize 50
