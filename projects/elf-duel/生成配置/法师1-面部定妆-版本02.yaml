  slight three-quarter turn. One elongated blue-violet faceted diamond gemstone sits vertically
  at the center of her forehead, held by extremely fine silver twig filigree lying close to the skin,
  forming small V-shaped branches toward the temples. Ultrafine skin-adhering translucent crystal
